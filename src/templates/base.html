<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!--Linking the styles-css file path-->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <!--    boostrap link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link href='https://fonts.googleapis.com/css?family=Aclonica' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--  linking the boostrap icons  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

    <!--    Title template   -->
    <title> {% block title %}Base Page{% endblock %} </title>

</head>


<body>
<div style="">
    <!--    Nav start   -->
    <nav class="navbar navbar-light bg-dark py-2">
        <!-- Container wrapper -->
        <div class="container ">
            <a class="nav-link fw-semibold fs-3 text-warning" href="{{url_for('index')}}"><i
                    class="fa-solid fa-school "></i> STUDENT
                MANAGEMENT SYSTEM</a>
            <!-- Left links -->
            <div class="collapse  d-flex justify-content-end" id="navbarNav">
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a class="nav-link  {{'active text-primary' if request.path == '/' else 'text-light' }}"
                           href="{{url_for('index')}}"><i
                                class="bi bi-house-door-fill {{'active text-warning' if request.path == '/' else 'text-light' }}"></i>
                            Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{'active text-primary' if request.path == '/students' else 'text-light'}}"
                           href="{{url_for('students')}}"><i
                                class="bi bi-person-lines-fill {{'active text-warning' if request.path == '/students' else 'text-light'}}"></i>
                            Student Details</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{'active text-primary' if request.path == '/add_student/' else 'text-light'}}"
                           href="{{url_for('add_student')}}"> <i
                                class="bi bi-person-plus-fill {{'active text-warning' if request.path == '/add_student/' else 'text-light'}}"></i>
                            Add Student</a>
                    </li>
                    <li class="nav-item">
                        <!--                    <a class="nav-link mx-auto p-2" href="{{url_for('search_student')}}">Search Student</a>-->
                        <form method="post" action="{{url_for('search_student')}}" class="d-flex" role="search">
                            <input class="form-control mb-2 my-1 mx-2" type="search" name="query"
                                   placeholder="Name / Roll No.."
                                   aria-label="Search"
                                   style="width:180px; height:33px;">
                            <button class="btn btn-outline-primary px-3 my-1 mb-2" type="submit"><i
                                    class="bi bi-search"></i></button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--    Nav End  -->
</div>

<!-- Jinja template for the content  -->
{% block content %} {% endblock %}

<!----Footer Start----->
<footer class="bg-dark text-center text-lg-start py-2 ">
    <!-- Copyright -->
    <div class="text-center p-1 text-white" style="background-color: rgba(0, 0, 0, 0.05);">
        &copy; 2026 Copyright:
        <a class="text-body-primary" href="#">@rabbunimerugumala</a>
    </div>
    <!-- Copyright -->
</footer>
<!----Footer End ----->
</body>
</html>
