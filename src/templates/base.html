<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Management System{% endblock %}</title>

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/style.css') }}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>

<body>

<header class="site-header">

    <nav class="main-navbar">

        <div class="navbar-container">

            <!-- Brand -->
            <a href="{{ url_for('index') }}" class="brand">
                <span class="brand-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </span>

                <span>
                    Student
                    <span class="brand-accent">Management</span>
                </span>
            </a>

            <!-- Navigation -->
            <div class="navigation">

                <a href="{{ url_for('index') }}"
                   class="nav-item {{ 'active' if request.path == '/' else '' }}">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>

                <a href="{{ url_for('students') }}"
                   class="nav-item {{ 'active' if request.path == '/students' else '' }}">
                    <i class="bi bi-people-fill"></i>
                    <span>Students</span>
                </a>

                <a href="{{ url_for('add_student') }}"
                   class="nav-item {{ 'active' if request.path == '/add_student/' else '' }}">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Add Student</span>
                </a>

                <!-- Search -->
                <form method="post"
                      action="{{ url_for('search_student') }}"
                      class="navbar-search">

                    <i class="bi bi-search"></i>

                    <input
                        type="search"
                        name="query"
                        placeholder="Search students..."
                        aria-label="Search students">

                    <button type="submit">
                        <i class="bi bi-arrow-right"></i>
                    </button>

                </form>

            </div>

        </div>

    </nav>

</header>


<!-- Page Content -->
<main>
    {% block content %}{% endblock %}
</main>


<!-- Footer -->
<footer class="site-footer">

    <div class="footer-content">

        <span>
            © 2026 Student Management System
        </span>

        <span class="footer-author">
            Built by <strong>@rabbunimerugumala</strong>
        </span>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
